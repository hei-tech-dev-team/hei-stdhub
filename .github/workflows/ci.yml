name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hei_stdhub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Create test .env
        run: |
          cat > .env << EOF
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hei_stdhub_test
          JWT_SECRET=test-secret-for-ci
          CLIENT_URL=http://localhost:5173
          VAPID_PUBLIC_KEY=BO1W2CFCnUWyE_X57ZgLVV41xX_Bedt2Yckinj0fw37NVeIh4YLhPAODunV0aMFjZpDnMGEuTof8UrnmO2bZCxA
          VAPID_PRIVATE_KEY=lMUf_1nsIg_JhWtpeZUzMW7Iq7prVIjvjMgM363MIco
          NODE_ENV=test
          EOF

      - name: Seed database
        run: |
          psql "$DATABASE_URL" -f backend/db/schema.sql
          psql "$DATABASE_URL" -f backend/db/seed.dev.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hei_stdhub_test
          PGOPTIONS: "-c client_min_messages=warning"

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
